  <body>
    <svg width="0" height="0" class="defs" aria-hidden="true">
      <!--
        Wordmark die-cut, rounded: blurring the alpha and thresholding it grows the shape
        evenly in every direction, so corners come out round and the cut follows the letters.
        (feMorphology dilates with a square kernel, which reads boxy.)
      -->
      <filter id="diecut-lg" x="-20%" y="-40%" width="140%" height="180%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="wb" />
        <feComponentTransfer in="wb" result="w">
          <feFuncA type="linear" slope="60" intercept="-1.9" />
        </feComponentTransfer>
        <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="bb" />
        <feComponentTransfer in="bb" result="b">
          <feFuncA type="linear" slope="60" intercept="-0.7" />
        </feComponentTransfer>
        <feGaussianBlur in="b" stdDeviation="2" result="bs" />
        <feOffset in="bs" dx="6" dy="6" result="sh" />
        <feComponentTransfer in="sh" result="shadow">
          <feFuncA type="linear" slope=".7" />
        </feComponentTransfer>
        <feFlood flood-color="#0A0A0A" />
        <feComposite in2="b" operator="in" result="outline" />
        <feFlood flood-color="#FFFFFF" />
        <feComposite in2="w" operator="in" result="white" />
        <feMerge>
          <feMergeNode in="shadow" />
          <feMergeNode in="outline" />
          <feMergeNode in="white" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </svg>
