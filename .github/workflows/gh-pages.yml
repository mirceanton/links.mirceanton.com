---
name: GitHub Pages

on:
  push: {}
  # Rebuild every 8 hours so the latest video and post cards stay current.
  # GitHub's scheduler often runs late or skips runs, hence a loose interval.
  schedule:
    - cron: "23 */8 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Dry Run
        default: true
        required: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # If a feed can't be read, the script leaves index.html alone and the
      # committed cards ship instead, so a feed outage never blocks a deploy.
      - name: Fill in the latest video and post
        run: python3 scripts/update-latest.py || echo "::warning::Couldn't read the feeds; keeping the committed latest cards."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: ./site }

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: "${{ (github.event_name == 'push' && github.ref_name == 'main') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry-run == false)}}"

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: "${{ secrets.BOT_APP_ID }}"
          private-key: "${{ secrets.BOT_APP_PRIVATE_KEY }}"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          token: "${{ steps.app-token.outputs.token }}"
